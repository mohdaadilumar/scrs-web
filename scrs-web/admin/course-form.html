<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Add Course - Admin | SCRS</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="navbar">
    <div class="brand">🎓 SCRS &mdash; Admin Panel</div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="courses.html">Courses</a>
        <a href="registrations.html">Registrations</a>
        <a href="#" id="logout-link">Logout</a>
    </div>
</div>
<div class="container">

<div class="card" style="max-width:480px;">
    <h2 id="form-heading">Add Course</h2>
    <div id="error-box"></div>

    <form id="course-form">
        <label>Course Code</label>
        <input type="text" id="code" required>

        <label>Course Name</label>
        <input type="text" id="name" required>

        <label>Course Credit</label>
        <input type="number" id="credit" min="1" required>

        <label>Course Mode</label>
        <select id="mode" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>

        <button type="submit" class="btn" id="submit-btn">Save Course</button>
        <a href="courses.html" class="btn secondary">Cancel</a>
    </form>
</div>

</div>

<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
requireAdmin('../');

const params = new URLSearchParams(window.location.search);
const editId = params.get('id') ? Number(params.get('id')) : null;

if (editId) {
    document.getElementById('page-title').textContent = 'Edit Course - Admin | SCRS';
    document.getElementById('form-heading').textContent = 'Edit Course';
    document.getElementById('submit-btn').textContent = 'Update Course';

    const course = Store.findCourseById(editId);
    if (!course) {
        setFlash('error', 'Course not found.');
        window.location.href = 'courses.html';
    } else {
        document.getElementById('code').value = course.code;
        document.getElementById('name').value = course.name;
        document.getElementById('credit').value = course.credit;
        document.getElementById('mode').value = course.mode;
    }
}

document.getElementById('course-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const errors = [];

    const code = document.getElementById('code').value.trim();
    const name = document.getElementById('name').value.trim();
    const credit = Number(document.getElementById('credit').value);
    const mode = document.getElementById('mode').value;

    if (!code) errors.push('Course code is required.');
    if (!name) errors.push('Course name is required.');
    if (!credit || credit <= 0) errors.push('Course credit must be greater than 0.');
    if (!['A', 'B', 'C'].includes(mode)) errors.push('Course mode must be A, B, or C.');

    const data = Store.get();
    const dupe = data.courses.find(c => c.code.toLowerCase() === code.toLowerCase() && c.id !== editId);
    if (dupe) errors.push('This course code already exists.');

    if (errors.length) {
        document.getElementById('error-box').innerHTML =
            errors.map(err => `<div class="alert alert-error">${esc(err)}</div>`).join('');
        return;
    }

    if (editId) {
        const course = data.courses.find(c => c.id === editId);
        course.code = code; course.name = name; course.credit = credit; course.mode = mode;
        Store.save(data);
        setFlash('success', 'Course updated successfully.');
    } else {
        data.courses.push({ id: nextId(data.courses), code, name, credit, mode });
        Store.save(data);
        setFlash('success', 'Course added successfully.');
    }

    window.location.href = 'courses.html';
});

document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    logout('login.html');
});
</script>
</body>
</html>
